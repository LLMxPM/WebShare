<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="640" viewBox="0 192 1536 640" role="img" aria-labelledby="title desc">
  <title id="title">WebShare</title>
  <desc id="desc">清理后的 WebShare 标识，使用几何图形和可编辑文字重绘，去除光栅描摹噪点。</desc>
  <defs>
    <linearGradient id="folderGradient" x1="159" y1="516" x2="423" y2="692" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#179DFF"/>
      <stop offset="1" stop-color="#075BE8"/>
    </linearGradient>
    <linearGradient id="shareGradient" x1="397" y1="511" x2="503" y2="617" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1CDFBE"/>
      <stop offset="1" stop-color="#12BFAE"/>
    </linearGradient>
    <mask id="shareGapMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024">
      <rect width="1536" height="1024" fill="#ffffff"/>
      <circle cx="450" cy="564" r="70" fill="#000000"/>
    </mask>
    <style>
      .window-stroke {
        fill: none;
        stroke: #0c6ef5;
        stroke-width: 18;
        stroke-linecap: square;
      }

      .code-mark {
        fill: none;
        stroke: #0c6ef5;
        stroke-width: 18;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .upload-mark {
        fill: none;
        stroke: #ffffff;
        stroke-width: 18;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .share-mark {
        fill: none;
        stroke: #ffffff;
        stroke-width: 10;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

    </style>
  </defs>

