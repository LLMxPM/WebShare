# 文件功能描述：主分支发布时构建 Windows 包、创建 GitHub Release 并推送 Docker Hub 镜像。
name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 手动发布版本，例如 v1.2.3；留空时使用 v0.1.<run_number>
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备发布版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 生成发布版本号
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            version="v0.1.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::发布版本必须类似 v1.2.3 或 v1.2.3-rc.1"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "发布版本: $version"

  windows:
    name: 构建 Windows 发布包
    runs-on: windows-latest
    needs: prepare
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm --dir web install --frozen-lockfile

      - name: 打包 Windows 单 EXE
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          .\scripts\build-windows-single.ps1

          $packageDir = "release\windows-amd64"
          if (Test-Path $packageDir) {
            Remove-Item -LiteralPath $packageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force $packageDir | Out-Null

          Copy-Item -LiteralPath "release\webshare.exe" -Destination $packageDir -Force
          Copy-Item -LiteralPath "README.md" -Destination (Join-Path $packageDir "README.md") -Force
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $packageDir "LICENSE.txt") -Force

          $archive = "release\WebShare-$env:RELEASE_VERSION-windows-amd64.zip"
          if (Test-Path $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $archive -Force

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: WebShare ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: release/WebShare-${{ needs.prepare.outputs.version }}-windows-amd64.zip

  docker:
    name: 构建并推送 Docker Hub 镜像
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ vars.DOCKERHUB_REPOSITORY != '' }}
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 校验 Docker Hub 配置
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::请配置 GitHub Secrets: DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: 启用 QEMU 多架构模拟
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 启用 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=WebShare
            org.opencontainers.image.description=局域网静态页面托管与分享服务
            org.opencontainers.image.licenses=Apache-2.0

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
